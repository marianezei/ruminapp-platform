{% extends "rebanho/base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="login">
  <div class="cartao">
    <h1>RuminApp</h1>
    <p class="sub">Entre com seu usuário para ver o painel do dia.</p>
    <form method="post" class="formulario">{% csrf_token %}
      {% if form.errors %}<p class="erros-gerais">Usuário ou senha incorretos.</p>{% endif %}
      <div class="campo"><label for="id_username">Usuário</label>{{ form.username }}</div>
      <div class="campo"><label for="id_password">Senha</label>{{ form.password }}</div>
      <button class="botao" type="submit">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
